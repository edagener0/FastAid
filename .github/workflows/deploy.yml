name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.GCP_REGION }}
      BACKEND_SERVICE: fastaid-backend
      FRONTEND_SERVICE: fastaid-frontend
      INSTANCE_CONNECTION_NAME: ${{ secrets.INSTANCE_CONNECTION_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Build and push backend container
        run: |
          gcloud builds submit ./backend \
            --tag gcr.io/${PROJECT_ID}/${BACKEND_SERVICE}:$GITHUB_SHA

      - name: Build and push frontend container
        run: |
          gcloud builds submit ./frontend/fastaid \
            --tag gcr.io/${PROJECT_ID}/${FRONTEND_SERVICE}:$GITHUB_SHA

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy ${BACKEND_SERVICE} \
            --image gcr.io/${PROJECT_ID}/${BACKEND_SERVICE}:$GITHUB_SHA \
            --region ${REGION} \
            --allow-unauthenticated \
            --update-env-vars DATABASE_URL=postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@/fastaid?host=/cloudsql/${INSTANCE_CONNECTION_NAME},CORS_ORIGINS=https://YOUR_FRONTEND_URL \
            --add-cloudsql-instances ${INSTANCE_CONNECTION_NAME}

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy ${FRONTEND_SERVICE} \
            --image gcr.io/${PROJECT_ID}/${FRONTEND_SERVICE}:$GITHUB_SHA \
            --region ${REGION} \
            --allow-unauthenticated